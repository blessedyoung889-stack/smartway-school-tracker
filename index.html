<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Way Attendance</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Login View -->
    <section id="login-section" class="view">
        <h2>Login</h2>
        <form id="login-form">
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <p>Don't have an account? <a href="#" onclick="switchView('register-section')">Register</a></p>
    </section>

    <!-- Registration View -->
    <section id="register-section" class="view" style="display: none;">
        <h2>Register Student</h2>
        <form id="register-form">
            <input type="email" id="register-email" placeholder="Email" required>
            <input type="password" id="register-password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="#" onclick="switchView('login-section')">Login</a></p>
    </section>

    <!-- Dashboard View -->
    <section id="dashboard-section" class="view" style="display: none;">
        <h2>Welcome to Dashboard</h2>
        <button id="logout-btn">Log Out</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
