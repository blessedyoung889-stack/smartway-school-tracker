<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Way - Digi Register</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="app-container">
        
        <!-- Header / Logo -->
        <header class="app-header">
            <h1 class="logo">Smart Way</h1>
            <p class="subtitle">Digi Register System</p>
        </header>

        <!-- VIEW 1: LOGIN PAGE -->
        <section id="login-view" class="view">
            <div class="card">
                <h2>Welcome Back</h2>
                <p class="card-subtitle">Sign in to manage attendance</p>
                <form id="login-form">
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="login-email" placeholder="admin@school.com" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </form>
                <div class="card-footer">
                    <p>Need an account? <a href="#" id="go-to-register">Register School</a></p>
                </div>
            </div>
        </section>

        <!-- VIEW 2: ADMIN REGISTRATION -->
        <section id="register-view" class="view hidden">
            <div class="card">
                <h2>Register Admin</h2>
                <p class="card-subtitle">Create a school management account</p>
                <form id="register-form">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="reg-name" required>
                    </div>
                    <div class="input-group">
                        <label>School Name</label>
                        <input type="text" id="reg-school" required>
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="reg-email" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Account</button>
                </form>
                <div class="card-footer">
                    <p>Already registered? <a href="#" id="go-to-login">Sign In</a></p>
                </div>
            </div>
        </section>

        <!-- VIEW 3: MAIN DASHBOARD (Protected) -->
        <section id="dashboard-view" class="view hidden">
            <div class="card">
                <div class="dashboard-header">
                    <h2>Admin Dashboard</h2>
                    <button id="logout-btn" class="btn-sm btn-outline">Logout</button>
                </div>
                <p class="card-subtitle">Live Attendance Summary</p>

                <div class="stats-grid">
                    <div class="stat-box">
                        <p class="stat-label">Total Students</p>
                        <p class="stat-number" id="total-count">0</p>
                    </div>
                    <div class="stat-box">
                        <p class="stat-label">Present Today</p>
                        <p class="stat-number" id="present-count">0</p>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="scan-qr-btn" class="btn btn-success">Scan QR Code</button>
                    <button id="manual-entry-btn" class="btn btn-secondary">Manual Entry</button>
                </div>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
